[project]
name = "jev-linkedin-saved-classifier"
version = "0.1.0"
description = "Read your LinkedIn saved posts into a filterable board, classified by Jev."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git",
]

[project.scripts]
jev-linkedin-saved = "jev_linkedin_saved.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jev_linkedin_saved"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
